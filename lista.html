<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Casos — Patologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lista.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__icon">🔬</span>
      <div>
        <h1>Lista de Casos</h1>
        <p class="site-header__sub">Visão geral para o check com o preceptor</p>
      </div>
      <nav class="site-nav">
        <a href="index.html" class="nav-link">← Organizador</a>
      </nav>
    </div>
  </header>

  <div class="page-wrapper">

    <!-- Filtros e contagem -->
    <div class="list-toolbar">
      <div class="list-toolbar__filters">
        <button class="filter-btn active" data-filter="all">Todos <span class="filter-count" id="cnt-all">—</span></button>
        <button class="filter-btn" data-filter="a-ser-visto">👁️ A ser visto <span class="filter-count" id="cnt-f-a-ser-visto">—</span></button>
        <button class="filter-btn" data-filter="encaminhado">✅ Encaminhado <span class="filter-count" id="cnt-f-encaminhado">—</span></button>
        <button class="filter-btn" data-filter="terceirizado">🔀 Terceirizado <span class="filter-count" id="cnt-f-terceirizado">—</span></button>
        <button class="filter-btn" data-filter="pendencia">⏳ Pendência <span class="filter-count" id="cnt-f-pendencia">—</span></button>
      </div>
      <p class="list-toolbar__hint">Arraste as linhas para reordenar</p>
    </div>

    <!-- Lista principal -->
    <div class="list-surface">
      <div id="case-list">
        <div class="list-loading">Carregando casos…</div>
      </div>
      <div class="empty-state" id="empty-list" hidden>
        <div class="empty-state__icon">🎉</div>
        <p>Nenhum caso em aberto.</p>
      </div>
    </div>

    <!-- Segunda opinião -->
    <div class="section-divider" style="margin-top:32px;"><span>Segunda Opinião</span></div>

    <div class="list-surface" style="margin-top:12px;">
      <div id="opiniao-list">
        <div class="list-loading">Carregando…</div>
      </div>
      <div class="empty-state" id="empty-opiniao-list" hidden>
        <div class="empty-state__icon">📭</div>
        <p>Nenhum caso de segunda opinião em aberto.</p>
      </div>
    </div>

  </div>

  <script type="module" src="lista.js"></script>
</body>
</html>
