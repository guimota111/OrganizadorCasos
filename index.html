<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador de Casos — Patologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lista.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__icon">🔬</span>
      <div>
        <h1>Organizador de Casos</h1>
        <p class="site-header__sub">Patologia — controle de pré-laudos</p>
      </div>
    </div>
  </header>

  <div class="page-wrapper">

    <!-- ── Contadores ── -->
    <div class="stats-bar" role="region" aria-label="Resumo de casos">
      <div class="stat-card">
        <div class="stat-card__value" id="cnt-total">—</div>
        <div class="stat-card__label">Total</div>
      </div>
      <div class="stat-card stat-card--a-ser-visto">
        <div class="stat-card__value" id="cnt-a-ser-visto">—</div>
        <div class="stat-card__label">A ser visto</div>
      </div>
      <div class="stat-card stat-card--encaminhado">
        <div class="stat-card__value" id="cnt-encaminhado">—</div>
        <div class="stat-card__label">Encaminhados</div>
      </div>
      <div class="stat-card stat-card--terceirizado">
        <div class="stat-card__value" id="cnt-terceirizado">—</div>
        <div class="stat-card__label">Terceirizados</div>
      </div>
      <div class="stat-card stat-card--pendencia">
        <div class="stat-card__value" id="cnt-pendencia">—</div>
        <div class="stat-card__label">Com pendência</div>
      </div>
      <div class="stat-card stat-card--liberado">
        <div class="stat-card__value" id="cnt-liberado">—</div>
        <div class="stat-card__label">Liberados</div>
      </div>
    </div>

    <!-- ── Formulário — Novo Caso ── -->
    <section class="section" id="form-section">
      <button type="button" class="section__toggle" id="form-toggle" aria-expanded="false" aria-controls="form-body">
        <h2 class="section__title">📝 <span id="form-title">Novo Caso</span></h2>
        <span class="section__chevron" aria-hidden="true">▾</span>
      </button>
      <div id="form-body" hidden>
        <form id="case-form" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="nome">Nome do paciente *</label>
              <input type="text" id="nome" placeholder="Ex.: João da Silva" required />
            </div>
            <div class="form-group">
              <label for="fap">FAP — código do caso *</label>
              <input type="text" id="fap" placeholder="Ex.: FAP-2024-001" required />
            </div>
            <div class="form-group form-group--full">
              <label for="resumo-linha">Resumo em uma linha</label>
              <input type="text" id="resumo-linha" placeholder="Ex.: Nódulo tireoidiano, punção prévia inconclusiva" />
            </div>
            <div class="form-group form-group--full">
              <label for="resumo">Resumo clínico completo</label>
              <textarea id="resumo" rows="3" placeholder="Breve descrição do caso para referência..."></textarea>
            </div>
            <div class="form-group form-group--full">
              <label>Status do caso *</label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="status" value="a-ser-visto" checked />
                  👁️ A ser visto — cadastrado, ainda não analisado
                </label>
                <label class="radio-label">
                  <input type="radio" name="status" value="encaminhado" />
                  ✅ Encaminhado — aguardando discussão com o preceptor
                </label>
                <label class="radio-label">
                  <input type="radio" name="status" value="terceirizado" />
                  🔀 Terceirizado — está no monitor, com outro profissional
                </label>
                <label class="radio-label">
                  <input type="radio" name="status" value="pendencia" />
                  ⏳ Pendência — descrever abaixo
                </label>
              </div>
            </div>
            <div class="form-group form-group--full" id="pendencia-group" hidden>
              <label for="pendencia-desc">Descrição da pendência</label>
              <input type="text" id="pendencia-desc" placeholder="Descreva o que está pendente..." />
            </div>
          </div>
          <div class="form-actions" style="margin-top:20px;">
            <button type="submit" class="btn btn--primary">Salvar caso</button>
            <button type="button" class="btn btn--ghost" id="cancel-edit" hidden>Cancelar edição</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ── Filtros e lista ── -->
    <div class="list-toolbar">
      <div class="list-toolbar__filters">
        <button class="filter-btn active" data-filter="all">Todos <span class="filter-count" id="cnt-all">—</span></button>
        <button class="filter-btn" data-filter="a-ser-visto">👁️ A ser visto <span class="filter-count" id="cnt-f-a-ser-visto">—</span></button>
        <button class="filter-btn" data-filter="encaminhado">✅ Encaminhado <span class="filter-count" id="cnt-f-encaminhado">—</span></button>
        <button class="filter-btn" data-filter="terceirizado">🔀 Terceirizado <span class="filter-count" id="cnt-f-terceirizado">—</span></button>
        <button class="filter-btn" data-filter="pendencia">⏳ Pendência <span class="filter-count" id="cnt-f-pendencia">—</span></button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn--ghost btn--sm" id="export-img-btn">📷 Gerar imagem</button>
        <p class="list-toolbar__hint">Arraste as linhas para reordenar</p>
      </div>
    </div>

    <div class="list-surface">
      <div id="case-list"></div>
      <div class="empty-state" id="empty-list" hidden>
        <div class="empty-state__icon">🎉</div>
        <p>Nenhum caso em aberto.</p>
      </div>
    </div>

    <!-- ── Casos liberados ── -->
    <section class="section" id="released-section" style="margin-top:24px;">
      <button type="button" class="section__toggle" id="released-toggle" aria-expanded="false" aria-controls="released-body">
        <h2 class="section__title">📂 Casos liberados <span class="tab-badge" id="badge-liberado" style="margin-left:8px;">0</span></h2>
        <span class="section__chevron" aria-hidden="true">▾</span>
      </button>
      <div id="released-body" hidden>
        <div class="list-surface" style="margin-top:16px;">
          <div id="released-list"></div>
          <div class="empty-state" id="empty-released" hidden>
            <div class="empty-state__icon">📂</div>
            <p>Nenhum caso liberado ainda.</p>
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ── Modal exclusão ── -->
  <div class="modal-overlay" id="delete-modal" hidden role="dialog" aria-modal="true">
    <div class="modal">
      <h2>Confirmar exclusão</h2>
      <p id="delete-modal-msg"></p>
      <div class="modal__actions">
        <button class="btn btn--ghost" id="cancel-delete">Cancelar</button>
        <button class="btn btn--danger" id="confirm-delete">Excluir</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
